name: bugs-export

# Daily export of the bug reports from Firestore into bugs/inbox/ on the dev branch (F6b).
# Secret FIREBASE_SA = service-account JSON (Actions secret); it is only read from the environment by tools/bugs/export_bugs.py.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bugs-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install firebase-admin
        run: pip install --quiet firebase-admin
      - name: Export new reports
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: python tools/bugs/export_bugs.py bugs/inbox
      - name: Commit and push (only if files were added)
        run: |
          git add bugs/inbox
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          N=$(git diff --cached --name-only -- 'bugs/inbox/*.json' | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "bugs: export ${N} report(s)"
          # dev moved meanwhile: our commit only adds new files under bugs/inbox/, so replaying it on top of the new tip cannot conflict
          git push origin HEAD:dev || { git pull --rebase origin dev && git push origin HEAD:dev; }
