name: players-cleanup

# L3b: player-account cleanup (§10.7). Manual run: mode dry-run (default, deletes nothing) or live. Daily 06:30 UTC: always live.
# Live = the deletions tools/players/cleanup.py lists (capped at 25 accounts / 100 documents per run).
# Secret FIREBASE_SA = service-account JSON (Actions secret), read only from the environment by tools/players/cleanup.py.
# This file lives on BOTH main and dev (main is needed for "Run workflow"); keep the two copies identical.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default, deletes nothing) or live"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install firebase-admin
        run: pip install --quiet firebase-admin
      - name: Cleanup
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
        run: if [ "$MODE" = "live" ]; then python tools/players/cleanup.py --live; else python tools/players/cleanup.py; fi
