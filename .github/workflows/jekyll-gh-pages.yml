# Pages deploy: stable (main) at the site root, dev branch at /dev/
name: Deploy Pages (main at /, dev at /dev/)

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site
      - name: Checkout dev (falls back to main's content)
        run: |
          if git ls-remote --exit-code --heads "${{ github.server_url }}/${{ github.repository }}" dev >/dev/null 2>&1; then
            git clone --depth 1 --branch dev "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" _site/dev
          else
            mkdir -p _site/dev && cp -r _site/. _site/dev/ 2>/dev/null || true
          fi
      - name: Clean
        run: |
          find _site -name .git -prune -exec rm -rf {} +
          rm -rf _site/dev/dev
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
