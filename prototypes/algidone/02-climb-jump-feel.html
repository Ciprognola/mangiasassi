<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>M0 · D3 — Sensazione di salto e arrampicata</title>
<style>
  :root{color-scheme:dark;--bg:#0b1220;--panel:#131d2e;--border:#223047;--text:#e6ecf5;--mute:#8fa0b8;
    --girder:#c98a3b;--girder-dk:#96601f;--ladder:#5bb0d9;--ladder-dk:#2f7594;--player:#e5484d;--goal:#ffce3d}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif;
    padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;
    min-height:100vh;touch-action:none}
  h1{font-size:16px;margin:0;text-align:center}
  .sub{color:var(--mute);font-size:12px;text-align:center;max-width:380px;margin:0}
  .stage-wrap{position:relative;border:2px solid var(--border);border-radius:10px;overflow:hidden;
    background:linear-gradient(#0d1626,#0a121f)}
  canvas{display:block;touch-action:none}
  .hud{position:absolute;top:6px;left:8px;font:11px/1.4 ui-monospace,monospace;color:#9fb0c3;
    background:rgba(10,16,26,.55);padding:4px 7px;border-radius:6px;pointer-events:none}
  .pad{display:flex;gap:22px;align-items:center;margin-top:2px}
  .dpad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;gap:4px}
  .dpad button{grid-column:2;background:var(--panel);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center}
  #du{grid-row:1}
  #dl{grid-row:2;grid-column:1}
  #dfill{grid-row:2;grid-column:2;visibility:hidden}
  #dr{grid-row:2;grid-column:3}
  #dd{grid-row:3}
  .jumpbtn{width:74px;height:74px;border-radius:50%;background:var(--player);border:1px solid #8f1f24;
    color:#fff;font-weight:700;font-size:13px}
  button{cursor:pointer}
  button:active,button.held{background:var(--girder);border-color:var(--girder);color:#1a1204}
  .jumpbtn:active,.jumpbtn.held{background:#ff8a8e;border-color:var(--player)}
  footer{color:var(--mute);font-size:11px;text-align:center;max-width:380px}
  kbd{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font:11px monospace}
</style>
</head>
<body>
<h1>M0 · D3 — Sensazione di salto e arrampicata</h1>
<p class="sub">Stessa struttura di D1. Blocco colorato al posto dell'Uomo roccia — solo fisica, non aspetto finale.</p>

<div class="stage-wrap">
  <canvas id="cv" width="360" height="560"></canvas>
  <div class="hud" id="hud"></div>
</div>

<div class="pad">
  <div class="dpad">
    <button id="du">▲</button>
    <button id="dl">◀</button>
    <div id="dfill"></div>
    <button id="dr">▶</button>
    <button id="dd">▼</button>
  </div>
  <button class="jumpbtn" id="jbtn">SALTA</button>
</div>

<footer>Tastiera: <kbd>←</kbd><kbd>→</kbd> cammina, <kbd>↑</kbd><kbd>↓</kbd> sale/scende sulle scale,
<kbd>Spazio</kbd> salta (anche dalla scala). Tocco: le stesse frecce + il pulsante SALTA qui sotto.</footer>

<script>
const cv = document.getElementById('cv'), x = cv.getContext('2d'), hud = document.getElementById('hud');
const W = cv.width, H = cv.height;

/* ============ STESSI DATI DI LIVELLO DI D1 (01-level-layout.html) ============ */
const GIRDERS = [
  { x1: 20, y1: 535, x2: 340, y2: 514 },
  { x1: 20, y1: 427, x2: 340, y2: 448 },
  { x1: 20, y1: 361, x2: 340, y2: 340 },
  { x1: 20, y1: 252, x2: 340, y2: 273 },
  { x1: 20, y1: 175, x2: 340, y2: 175 },
];
const LADDERS = [
  { x: 300, gTop: 1, gBot: 0 },
  { x: 60,  gTop: 2, gBot: 1 },
  { x: 300, gTop: 3, gBot: 2 },
  { x: 60,  gTop: 4, gBot: 3 },
];
function girderYAt(g, px) {
  const cx = Math.max(g.x1, Math.min(g.x2, px));
  const t = (cx - g.x1) / (g.x2 - g.x1);
  return g.y1 + (g.y2 - g.y1) * t;
}
const GOAL = { x: 300, gi: 4 };

/* ============ FISICA (numeri da tarare col feedback) ============ */
const GRAVITY = 980, WALK_SPEED = 120, CLIMB_SPEED = 105, JUMP_VY = -330, JUMP_OFF_LADDER_VY = -260;
const LADDER_SNAP_X = 20; // quanto vicino alla x di una scala per poterla usare

const P = { x: 40, y: 0, vx: 0, vy: 0, onGround: true, gi: 0, climbing: null, facing: 1, w: 18, h: 26 };
P.y = girderYAt(GIRDERS[0], P.x);

const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === ' ') doJump();
});
addEventListener('keyup', e => { keys[e.key] = false; });

const touch = { l:false, r:false, u:false, d:false };
function bindHold(id, on, off) {
  const el = document.getElementById(id);
  const start = e => { e.preventDefault(); el.classList.add('held'); on(); };
  const end = e => { e.preventDefault(); el.classList.remove('held'); off(); };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', end);
  el.addEventListener('pointerleave', end);
  el.addEventListener('pointercancel', end);
}
bindHold('dl', () => touch.l = true, () => touch.l = false);
bindHold('dr', () => touch.r = true, () => touch.r = false);
bindHold('du', () => touch.u = true, () => touch.u = false);
bindHold('dd', () => touch.d = true, () => touch.d = false);
document.getElementById('jbtn').addEventListener('pointerdown', e => { e.preventDefault(); doJump(); });

function inputLeft()  { return keys['ArrowLeft']  || keys['a'] || keys['A'] || touch.l; }
function inputRight() { return keys['ArrowRight'] || keys['d'] || keys['D'] || touch.r; }
function inputUp()    { return keys['ArrowUp']    || keys['w'] || keys['W'] || touch.u; }
function inputDown()  { return keys['ArrowDown']  || keys['s'] || keys['S'] || touch.d; }

function nearestLadder() {
  let best = null, bestD = LADDER_SNAP_X;
  for (const l of LADDERS) {
    if (l.gTop !== P.gi && l.gBot !== P.gi) continue;
    const d = Math.abs(P.x - l.x);
    if (d < bestD) { bestD = d; best = l; }
  }
  return best;
}

function doJump() {
  if (P.climbing) {
    // salta via dalla scala
    P.climbing = null; P.onGround = false; P.vy = JUMP_OFF_LADDER_VY;
    P.vx = inputLeft() ? -WALK_SPEED : inputRight() ? WALK_SPEED : 0;
    return;
  }
  if (P.onGround) { P.onGround = false; P.vy = JUMP_VY; }
}

let last = performance.now();
function step(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;

  if (P.climbing) {
    const l = P.climbing;
    const yTop = girderYAt(GIRDERS[l.gTop], l.x), yBot = girderYAt(GIRDERS[l.gBot], l.x);
    if (inputUp())      P.y -= CLIMB_SPEED * dt;
    else if (inputDown()) P.y += CLIMB_SPEED * dt;
    P.x = l.x;
    if (P.y <= yTop) { P.y = yTop; P.gi = l.gTop; P.climbing = null; P.onGround = true; }
    else if (P.y >= yBot) { P.y = yBot; P.gi = l.gBot; P.climbing = null; P.onGround = true; }
  } else {
    // movimento orizzontale
    P.vx = inputLeft() ? -WALK_SPEED : inputRight() ? WALK_SPEED : 0;
    if (P.vx < 0) P.facing = -1; else if (P.vx > 0) P.facing = 1;
    P.x += P.vx * dt;
    P.x = Math.max(14, Math.min(W - 14, P.x));

    if (P.onGround) {
      // aggancio alla scala se vicino e si preme su/giu' in modo coerente
      const l = nearestLadder();
      if (l && inputUp() && l.gBot === P.gi) { P.climbing = l; P.onGround = false; P.x = l.x; }
      else if (l && inputDown() && l.gTop === P.gi) { P.climbing = l; P.onGround = false; P.x = l.x; }
      else {
        const g = GIRDERS[P.gi];
        if (P.x >= g.x1 && P.x <= g.x2) P.y = girderYAt(g, P.x);
        else P.onGround = false; // caduto oltre il bordo dell'impalcatura
      }
    }

    if (!P.onGround && !P.climbing) {
      P.vy += GRAVITY * dt;
      const prevY = P.y;
      P.y += P.vy * dt;
      if (P.vy >= 0) {
        for (let i = 0; i < GIRDERS.length; i++) {
          const g = GIRDERS[i];
          if (P.x < g.x1 || P.x > g.x2) continue;
          const gy = girderYAt(g, P.x);
          if (prevY <= gy && P.y >= gy) { P.y = gy; P.vy = 0; P.onGround = true; P.gi = i; break; }
        }
      }
      if (P.y > H + 40) { // caduto fuori dal piano -> respawn (rete di sicurezza del prototipo)
        P.x = 40; P.gi = 0; P.y = girderYAt(GIRDERS[0], P.x); P.vy = 0; P.onGround = true;
      }
    }
  }

  draw();
  requestAnimationFrame(step);
}

function draw() {
  x.clearRect(0, 0, W, H);

  x.lineCap = 'round';
  LADDERS.forEach(l => {
    const yTop = girderYAt(GIRDERS[l.gTop], l.x), yBot = girderYAt(GIRDERS[l.gBot], l.x);
    x.strokeStyle = getCss('--ladder'); x.lineWidth = 6;
    x.beginPath(); x.moveTo(l.x, yTop); x.lineTo(l.x, yBot); x.stroke();
    x.strokeStyle = getCss('--ladder-dk'); x.lineWidth = 3;
    for (let py = yTop + 8; py < yBot; py += 14) { x.beginPath(); x.moveTo(l.x - 7, py); x.lineTo(l.x + 7, py); x.stroke(); }
  });

  GIRDERS.forEach(g => {
    x.strokeStyle = getCss('--girder-dk'); x.lineWidth = 14;
    x.beginPath(); x.moveTo(g.x1, g.y1 + 3); x.lineTo(g.x2, g.y2 + 3); x.stroke();
    x.strokeStyle = getCss('--girder'); x.lineWidth = 10;
    x.beginPath(); x.moveTo(g.x1, g.y1); x.lineTo(g.x2, g.y2); x.stroke();
  });

  // obiettivo
  const goalY = girderYAt(GIRDERS[GOAL.gi], GOAL.x);
  x.fillStyle = getCss('--goal');
  x.beginPath(); x.arc(GOAL.x, goalY - 18, 14, 0, 7); x.fill();
  x.fillRect(GOAL.x - 10, goalY - 34, 20, 18);

  // giocatore (blocco colorato)
  x.save();
  x.translate(P.x, P.y);
  if (P.facing < 0) x.scale(-1, 1);
  x.fillStyle = getCss('--player');
  x.beginPath(); x.arc(0, -P.h - 4, 8, 0, 7); x.fill(); // testa
  x.fillRect(-P.w/2, -P.h, P.w, P.h - 4); // corpo
  x.fillStyle = '#1a0506'; x.fillRect(2, -P.h - 6, 3, 3); // occhio (indica il verso)
  x.restore();

  hud.textContent = 'girder ' + P.gi + (P.climbing ? ' · scala' : P.onGround ? ' · a terra' : ' · aria')
    + ' · x=' + P.x.toFixed(0) + ' y=' + P.y.toFixed(0);
}

const _cssCache = {};
function getCss(name) {
  if (!_cssCache[name]) _cssCache[name] = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return _cssCache[name];
}

requestAnimationFrame(step);
</script>
</body>
</html>
